name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo run -- schema --output schema/typsastra-docx-ir-v1.schema.json
      - run: git diff --exit-code -- schema/typsastra-docx-ir-v1.schema.json
      - run: cargo run -- validate examples/minimal.docx-ir.json
