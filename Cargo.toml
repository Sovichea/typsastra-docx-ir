[package]
name = "typsastra-docx-ir"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Source-aware intermediate representation of paginated DOCX layout"
license = "MIT"
repository = "https://github.com/Sovichea/typsastra-docx-ir"
homepage = "https://github.com/Sovichea/typsastra-docx-ir"
readme = "README.md"
keywords = ["docx", "layout", "ooxml", "document", "ai"]
categories = ["data-structures", "text-processing"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
